# Codex environment for classics.ourstuff.space
version = 1
name = "classics.ourstuff.space"

[setup]
script = ""

[setup.win32]
script = '''
Set-Location $env:CODEX_WORKTREE_PATH

Write-Host "Node:" -NoNewline
node --version
Write-Host "NPM:" -NoNewline
npm --version
Write-Host "Python:" -NoNewline
python --version

$env:PYTHONPATH = Join-Path $env:CODEX_WORKTREE_PATH "localaibrain\scripts"
$env:LOCAL_AI_BRAIN_HOME = Join-Path $env:CODEX_WORKTREE_PATH "localaibrain\brain"

if (Test-Path .\localaibrain\scripts\local_ai_brain) {
  python -m local_ai_brain doctor
}

$jsFiles = Get-ChildItem -Path ".\src\js" -Recurse -Filter "*.js" -ErrorAction SilentlyContinue | Sort-Object FullName
foreach ($file in $jsFiles) {
  node --check $file.FullName
}
'''

[cleanup]
script = '''
Set-Location $env:CODEX_WORKTREE_PATH
Get-Process node -ErrorAction SilentlyContinue |
  Where-Object { $_.Path -like "$env:CODEX_WORKTREE_PATH*" } |
  Stop-Process -Force -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .\artifacts\tmp -ErrorAction SilentlyContinue
'''

[[actions]]
name = "JS syntax"
icon = "test"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File .\\.codex\\actions\\js-syntax.ps1"
platform = "win32"

[[actions]]
name = "Brain doctor"
icon = "test"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File .\\.codex\\actions\\brain-doctor.ps1"
platform = "win32"

[[actions]]
name = "Serve static"
icon = "run"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File .\\.codex\\actions\\serve-static.ps1"
platform = "win32"

[[actions]]
name = "Codex title"
icon = "tool"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File .\\.codex\\actions\\codex-title.ps1"
platform = "win32"
